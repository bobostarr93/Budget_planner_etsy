<!DOCTYPE html>
<!--
  Coffer — a local-first, offline-capable household budget tracker.

  HOW TO RUN THIS APP
  --------------------
  There is nothing to install and nothing to build. Double-click this file
  (or open it with File > Open in any modern browser) and it runs entirely
  from disk. All data is stored in this browser's localStorage, on this
  device, under the key "cofferapp.data.v1". Nothing is ever sent over the
  network — this file makes zero outbound requests at runtime.

  To move your data to another device, use Settings > Backup to export a
  JSON file, then import it on the other device. On Chromium-based browsers
  you can also point Coffer at a local folder (ideally one your OS already
  cloud-syncs, e.g. Dropbox/Drive/OneDrive) and it will keep a backup file
  there automatically.

  This file is organized top to bottom as:
    <style>  design tokens (light + dark) and all component CSS
    <body>   a minimal static shell; everything else is rendered by JS
    <script> app code, in banner-commented sections (search for "=====")
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Coffer — Budget Planner</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root{
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-serif: Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Palatino, serif;

  /* light palette */
  --paper: #FAF7F2;
  --paper-raised: #FFFFFF;
  --ink: #1C1B19;
  --ink-soft: #55504A;
  --ink-faint: #8A8377;
  --line: #E3DDD1;
  --line-strong: #C9C0AE;
  --pine: #0F5257;
  --pine-strong: #0A3A3E;
  --pine-tint: #E4EEEE;
  --rust: #C1622D;
  --rust-tint: #FBEAE0;
  --gold: #C98A2C;
  --gold-tint: #FBF0DC;
  --good: #4B7B4E;
  --good-tint: #E7F0E6;
  --bad: #B23A3A;
  --bad-tint: #FBE7E5;
  --shadow: 0 1px 2px rgba(28,27,25,.06), 0 4px 14px rgba(28,27,25,.06);
  --radius: 6px;
  --focus: 0 0 0 3px rgba(15,82,87,.35);
}
:root[data-theme="dark"]{
  --paper: #16181A;
  --paper-raised: #1E2124;
  --ink: #F1EEE7;
  --ink-soft: #C7C0B4;
  --ink-faint: #8B8578;
  --line: #33363A;
  --line-strong: #454A4F;
  --pine: #4FB6BB;
  --pine-strong: #7ED4D8;
  --pine-tint: #1B2E30;
  --rust: #E08A54;
  --rust-tint: #382419;
  --gold: #E0AA55;
  --gold-tint: #382c15;
  --good: #7FBE82;
  --good-tint: #1c2b1c;
  --bad: #E08080;
  --bad-tint: #331c1c;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]):not([data-theme="dark"]){
    --paper: #16181A; --paper-raised: #1E2124; --ink: #F1EEE7; --ink-soft: #C7C0B4;
    --ink-faint: #8B8578; --line: #33363A; --line-strong: #454A4F;
    --pine: #4FB6BB; --pine-strong: #7ED4D8; --pine-tint: #1B2E30;
    --rust: #E08A54; --rust-tint: #382419; --gold: #E0AA55; --gold-tint: #382c15;
    --good: #7FBE82; --good-tint: #1c2b1c; --bad: #E08080; --bad-tint: #331c1c;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.35);
  }
}

/* ============================================================
   RESET & BASE
   ============================================================ */
*,*::before,*::after{ box-sizing: border-box; }
html,body{ height: 100%; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font-ui); font-size:15px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
img{ max-width:100%; }
button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; }
a{ color:var(--pine); }
h1,h2,h3,h4{ font-family:var(--font-serif); font-weight:600; margin:0 0 .4em; letter-spacing:.2px; }
table{ border-collapse:collapse; width:100%; }
.num{ font-family:var(--font-serif); font-variant-numeric:tabular-nums; }
[hidden]{ display:none !important; }
:focus-visible{ outline:none; box-shadow:var(--focus); border-radius:4px; }

/* ============================================================
   LAYOUT SHELL
   ============================================================ */
#app{ display:flex; min-height:100vh; }

.sidebar{
  width:250px; flex:0 0 auto; background:var(--paper-raised);
  border-right:1px solid var(--line); display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh; overflow-y:auto; z-index:20;
  transition: width .18s ease, transform .18s ease;
}
.sidebar.collapsed{ width:64px; }
.sidebar-brand{
  display:flex; align-items:center; gap:.6em; padding:16px 16px 12px;
  border-bottom:1px solid var(--line); flex:0 0 auto;
}
.sidebar-brand .mark{
  width:30px; height:30px; border-radius:7px; background:var(--pine); color:#fff;
  display:flex; align-items:center; justify-content:center; font-family:var(--font-serif);
  font-weight:700; flex:0 0 auto; font-size:15px;
}
.sidebar-brand .name{ font-family:var(--font-serif); font-weight:700; font-size:17px; white-space:nowrap; overflow:hidden; }
.sidebar.collapsed .name, .sidebar.collapsed .mini-cal, .sidebar.collapsed .navgroup-label, .sidebar.collapsed .navlabel{ display:none; }
.sidebar-toggle{
  margin-left:auto; background:none; border:1px solid var(--line); border-radius:6px;
  width:26px; height:26px; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);
}
.mini-cal{ padding:12px 14px; border-bottom:1px solid var(--line); flex:0 0 auto; }
.mini-cal .mc-head{ display:flex; align-items:center; justify-content:space-between; font-size:12.5px; font-weight:600; margin-bottom:6px; color:var(--ink-soft); }
.mini-cal .mc-head button{ background:none; border:0; color:var(--ink-faint); padding:2px 4px; }
.mini-cal table{ font-size:11px; }
.mini-cal th{ color:var(--ink-faint); font-weight:500; padding:2px 0; }
.mini-cal td{ text-align:center; padding:2px 0; border-radius:4px; cursor:pointer; color:var(--ink-soft); }
.mini-cal td:hover{ background:var(--line); }
.mini-cal td.today{ background:var(--pine); color:#fff; font-weight:700; }
.mini-cal td.has-tx::after{ content:""; display:block; width:3px; height:3px; border-radius:50%; background:var(--rust); margin:1px auto 0; }
.mini-cal td.other-month{ color:var(--ink-faint); opacity:.4; }

.nav{ flex:1 1 auto; overflow-y:auto; padding:8px 8px 16px; }
.navgroup{ margin-bottom:4px; }
.navgroup-label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint);
  padding:12px 10px 4px; font-weight:700;
}
.navlink{
  display:flex; align-items:center; gap:.65em; padding:8px 10px; border-radius:6px;
  color:var(--ink-soft); text-decoration:none; font-size:13.6px; white-space:nowrap; overflow:hidden;
}
.navlink .ico{ flex:0 0 auto; width:17px; text-align:center; opacity:.85; }
.navlink:hover{ background:var(--pine-tint); color:var(--ink); }
.navlink.active{ background:var(--pine); color:#fff; }
.sidebar.collapsed .navlink{ justify-content:center; padding:9px 0; }

.main{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; }

.statusbar{
  display:flex; flex-wrap:wrap; gap:0; align-items:stretch; background:var(--paper-raised);
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:15;
}
.statusbar .stat{ padding:10px 18px; border-right:1px solid var(--line); min-width:120px; }
.statusbar .stat .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-faint); margin-bottom:2px; }
.statusbar .stat .val{ font-family:var(--font-serif); font-size:17px; font-weight:700; }
.statusbar .stat .val.bad{ color:var(--bad); }
.statusbar .stat .val.good{ color:var(--good); }
.statusbar-actions{ margin-left:auto; display:flex; align-items:center; gap:8px; padding:0 14px; }

.topbar-mobile{ display:none; }

.content{ flex:1 1 auto; padding:20px 24px 60px; max-width:1280px; width:100%; margin:0 auto; }

/* ============================================================
   COMPONENTS
   ============================================================ */
.btn{
  display:inline-flex; align-items:center; gap:.5em; border:1px solid var(--line-strong);
  background:var(--paper-raised); color:var(--ink); border-radius:var(--radius);
  padding:8px 14px; font-size:13.5px; font-weight:600; line-height:1.2;
}
.btn:hover{ border-color:var(--pine); color:var(--pine); }
.btn-primary{ background:var(--pine); border-color:var(--pine); color:#fff; }
.btn-primary:hover{ background:var(--pine-strong); border-color:var(--pine-strong); color:#fff; }
.btn-danger{ background:var(--paper-raised); border-color:var(--bad); color:var(--bad); }
.btn-danger:hover{ background:var(--bad); color:#fff; }
.btn-ghost{ background:none; border-color:transparent; }
.btn-ghost:hover{ background:var(--line); border-color:transparent; color:var(--ink); }
.btn-sm{ padding:5px 10px; font-size:12.5px; }
.btn[disabled]{ opacity:.5; cursor:not-allowed; }
.btn-icon{ padding:6px 8px; }

.card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius);
  padding:16px 18px; margin-bottom:16px; box-shadow: var(--shadow);
}
.card > h3{ font-size:15.5px; display:flex; align-items:center; gap:.5em; }
.card-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }

.ledger-rule{ border:0; border-top:1px solid var(--line); margin:12px 0; }

.field{ margin-bottom:12px; }
.field label{ display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:4px; text-transform:uppercase; letter-spacing:.03em; }
.field .hint{ font-size:11.5px; color:var(--ink-faint); margin-top:3px; }
.field input[type=text], .field input[type=number], .field input[type=date],
.field input[type=password], .field select, .field textarea{
  width:100%; padding:8px 10px; border:1px solid var(--line-strong); border-radius:6px;
  background:var(--paper); color:var(--ink);
}
.field textarea{ resize:vertical; min-height:60px; }
.field-row{ display:flex; gap:12px; }
.field-row > .field{ flex:1 1 0; }
.checkbox-field{ display:flex; align-items:center; gap:.5em; margin-bottom:12px; }
.checkbox-field label{ font-size:13px; font-weight:600; text-transform:none; margin:0; }

.help-icon{
  display:inline-flex; align-items:center; justify-content:center; width:15px; height:15px;
  border-radius:50%; border:1px solid var(--ink-faint); color:var(--ink-faint); font-size:10px;
  font-weight:700; cursor:help; margin-left:4px; vertical-align:middle;
}

.badge{ display:inline-flex; align-items:center; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; }
.badge-income{ background:var(--good-tint); color:var(--good); }
.badge-savings{ background:var(--pine-tint); color:var(--pine); }
.badge-bills{ background:var(--gold-tint); color:var(--gold); }
.badge-expenses{ background:var(--rust-tint); color:var(--rust); }
.badge-debtPayments{ background:var(--bad-tint); color:var(--bad); }
.badge-subscriptions{ background:var(--line); color:var(--ink-soft); }
.badge-planned{ background:var(--line); color:var(--ink-soft); }
.badge-paid{ background:var(--good-tint); color:var(--good); }
.badge-overdue{ background:var(--bad-tint); color:var(--bad); }

.toolbar{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
.toolbar .spacer{ flex:1 1 auto; }
.filterbar{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:14px; }
.filterbar select, .filterbar input{ padding:6px 9px; border:1px solid var(--line-strong); border-radius:6px; background:var(--paper-raised); font-size:12.5px; }

.modal-overlay{
  position:fixed; inset:0; background:rgba(20,18,15,.45); display:flex; align-items:flex-start;
  justify-content:center; padding:5vh 16px; overflow-y:auto; z-index:100;
}
.modal{
  background:var(--paper-raised); border-radius:8px; width:100%; max-width:560px;
  box-shadow:0 20px 60px rgba(0,0,0,.3); border:1px solid var(--line);
}
.modal-head{ display:flex; align-items:center; padding:16px 20px; border-bottom:1px solid var(--line); }
.modal-head h3{ margin:0; flex:1; }
.modal-body{ padding:18px 20px; max-height:70vh; overflow-y:auto; }
.modal-foot{ display:flex; gap:8px; flex-wrap:wrap; padding:14px 20px; border-top:1px solid var(--line); justify-content:flex-end; }
.modal-close{ background:none; border:0; font-size:20px; color:var(--ink-faint); line-height:1; padding:4px 6px; }

.toast-root{ position:fixed; bottom:18px; right:18px; z-index:200; display:flex; flex-direction:column; gap:8px; }
.toast{ background:var(--ink); color:var(--paper); padding:10px 16px; border-radius:6px; font-size:13px; box-shadow:var(--shadow); max-width:320px; }
:root[data-theme="dark"] .toast{ background:var(--paper-raised); border:1px solid var(--line-strong); color:var(--ink); }

.empty-state{ text-align:center; padding:40px 20px; color:var(--ink-faint); }
.empty-state .big{ font-size:34px; margin-bottom:8px; }

.demo-banner{
  background:var(--gold-tint); color:var(--gold); border-bottom:1px solid var(--line);
  padding:8px 16px; font-size:12.5px; font-weight:600; text-align:center; display:flex;
  align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
}
.demo-banner button{ text-decoration:underline; background:none; border:0; color:inherit; font-weight:700; }

table.data-table{ font-size:13px; }
table.data-table th{ text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-faint); padding:6px 8px; border-bottom:1px solid var(--line-strong); }
table.data-table td{ padding:7px 8px; border-bottom:1px solid var(--line); }
table.data-table tr:hover td{ background:var(--pine-tint); }
table.data-table .row-actions{ display:flex; gap:4px; opacity:.6; }
table.data-table tr:hover .row-actions{ opacity:1; }

.chart-card svg{ display:block; }
.chart-wrap{ display:flex; gap:20px; flex-wrap:wrap; align-items:flex-start; }
.chart-legend{ font-size:12.5px; }
.chart-legend .li{ display:flex; align-items:center; gap:6px; padding:2px 0; }
.chart-legend .swatch{ width:9px; height:9px; border-radius:2px; flex:0 0 auto; }

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 860px){
  .sidebar{ position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%); width:260px; box-shadow:0 0 0 9999px rgba(0,0,0,0); }
  .sidebar.mobile-open{ transform:translateX(0); box-shadow:0 0 40px rgba(0,0,0,.35); }
  .sidebar.collapsed{ width:260px; }
  .sidebar.collapsed .name, .sidebar.collapsed .mini-cal, .sidebar.collapsed .navgroup-label, .sidebar.collapsed .navlabel{ display:block; }
  .topbar-mobile{
    display:flex; align-items:center; gap:10px; padding:10px 14px; background:var(--paper-raised);
    border-bottom:1px solid var(--line); position:sticky; top:0; z-index:15;
  }
  .topbar-mobile .mark{ width:26px; height:26px; border-radius:6px; background:var(--pine); color:#fff; display:flex; align-items:center; justify-content:center; font-family:var(--font-serif); font-weight:700; }
  .sidebar-toggle-mobile{ background:none; border:1px solid var(--line); border-radius:6px; width:32px; height:32px; }
  .content{ padding:14px 12px 50px; }
  .statusbar{ overflow-x:auto; }
  .statusbar .stat{ min-width:auto; padding:8px 12px; }
  .modal{ max-width:100%; }
  .field-row{ flex-direction:column; gap:0; }
}
@media (min-width:861px){
  .sidebar-backdrop{ display:none; }
}
.sidebar-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:19; }

/* ============================================================
   CALENDAR
   ============================================================ */
.cal-toolbar{ display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
.cal-toolbar h2{ margin:0; min-width:170px; }
.cal-toggles{ display:flex; gap:14px; margin-left:auto; font-size:12.5px; align-items:center; }
.cal-toggles label{ display:flex; align-items:center; gap:5px; }
.cal-grid{ display:grid; grid-template-columns:repeat(7,1fr); gap:1px; background:var(--line); border:1px solid var(--line); border-radius:6px; overflow:hidden; margin-bottom:18px; }
.cal-dow{ background:var(--paper-raised); padding:6px 8px; font-size:11px; font-weight:700; text-transform:uppercase; color:var(--ink-faint); text-align:center; }
.cal-day{ background:var(--paper-raised); min-height:96px; padding:5px; display:flex; flex-direction:column; gap:3px; cursor:pointer; }
.cal-day.other-month{ background:var(--paper); opacity:.55; }
.cal-day.today{ box-shadow:inset 0 0 0 2px var(--pine); }
.cal-day.drag-over{ background:var(--pine-tint); }
.cal-day .cal-daynum{ font-family:var(--font-serif); font-weight:700; font-size:12.5px; color:var(--ink-soft); }
.cal-chip{ font-size:10.5px; padding:2px 5px; border-radius:4px; cursor:grab; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; border-left:3px solid; }
.cal-chip.badge-income{ border-color:var(--good); }
.cal-chip.badge-savings{ border-color:var(--pine); }
.cal-chip.badge-bills{ border-color:var(--gold); }
.cal-chip.badge-expenses{ border-color:var(--rust); }
.cal-chip.badge-debtPayments{ border-color:var(--bad); }
.cal-chip.badge-subscriptions{ border-color:var(--ink-faint); }
.cal-chip.overdue{ outline:1px dashed var(--bad); }
.cal-chip.paid{ opacity:.55; text-decoration:line-through; }
.cal-more{ font-size:10px; color:var(--ink-faint); }
.cal-slidein{ position:fixed; right:0; top:0; bottom:0; width:min(340px,86vw); background:var(--paper-raised); box-shadow:-8px 0 30px rgba(0,0,0,.2); z-index:90; padding:16px; overflow-y:auto; border-left:1px solid var(--line); }
.cal-slidein-backdrop{ position:fixed; inset:0; background:rgba(0,0,0,.3); z-index:89; }
@media (max-width:860px){
  .cal-day{ min-height:52px; }
}
</style>
</head>
<body>
<div id="app" role="application" aria-label="Coffer budget planner"></div>
<div class="toast-root" id="toastRoot"></div>

<script>
"use strict";
/* global localStorage */

/* ===== SECTION: CONSTANTS ===== */
const APP_KEY = "cofferapp.data.v1";
const SCHEMA_VERSION = 1;
const CATEGORY_KEYS = ["income","savings","bills","expenses","debtPayments","subscriptions"];
const ACCOUNT_TYPES = ["checking","savings","cash","creditCard"];
const RECUR_FREQS = ["oneTime","daily","weekly","biweekly","monthly","every2months","quarterly","yearly"];
const PRIORITY_COUNT = 5;
const LANGS = ["en","fr","es","de"];

/* ===== SECTION: UTILITIES ===== */
function uid(prefix){ return (prefix||"id")+"_"+Math.random().toString(36).slice(2,10)+Date.now().toString(36); }
function clamp(n,lo,hi){ return Math.min(hi,Math.max(lo,n)); }
function deepClone(o){ return JSON.parse(JSON.stringify(o)); }
function debounce(fn,ms){ let t=null; return function(...args){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,args),ms); }; }
function isoDate(d){ if(typeof d==="string") return d.slice(0,10); const p=n=>String(n).padStart(2,"0"); return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); }
function todayISO(){ return isoDate(new Date()); }
function addDays(iso,n){ const d=new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return isoDate(d); }
function addMonths(iso,n){ const d=new Date(iso+"T00:00:00"); const day=d.getDate(); d.setDate(1); d.setMonth(d.getMonth()+n); const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate(); d.setDate(Math.min(day,last)); return isoDate(d); }
function addYears(iso,n){ return addMonths(iso,n*12); }
function ymOf(iso){ return iso.slice(0,7); }
function yearOf(iso){ return Number(iso.slice(0,4)); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function daysBetween(a,b){ return Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/86400000); }

function fmtMoney(cents_or_num){
  const s = Store.get().settings;
  const n = Number(cents_or_num)||0;
  try{
    const parts = new Intl.NumberFormat(localeTag(), { minimumFractionDigits:2, maximumFractionDigits:2 }).formatToParts(Math.abs(n));
    let numStr = parts.map(p=>p.value).join("");
    const sign = n<0 ? "-" : "";
    return s.currencyPosition==="before" ? sign+s.currencySymbol+numStr : sign+numStr+s.currencySymbol;
  }catch(e){ return (n<0?"-":"")+s.currencySymbol+Math.abs(n).toFixed(2); }
}
function fmtDate(iso, opts){
  if(!iso) return "";
  try{ return new Intl.DateTimeFormat(localeTag(), opts||{month:"short",day:"numeric",year:"numeric"}).format(new Date(iso+"T00:00:00")); }
  catch(e){ return iso; }
}
function fmtMonthYear(ym){
  try{ return new Intl.DateTimeFormat(localeTag(), {month:"long",year:"numeric"}).format(new Date(ym+"-01T00:00:00")); }
  catch(e){ return ym; }
}
function localeTag(){
  const map = { en:"en-US", fr:"fr-FR", es:"es-ES", de:"de-DE" };
  return map[Store.get().settings.language] || "en-US";
}

/* ===== SECTION: I18N ===== */
const I18N = { en:{}, fr:{}, es:{}, de:{} };

function t(key, params){
  const lang = (Store.get().settings.language) || "en";
  const [group, name] = key.split(".");
  let dict = (I18N[lang] && I18N[lang][group]) || {};
  let str = dict[name];
  if(str==null){ dict = I18N.en[group] || {}; str = dict[name]; }
  if(str==null) return key;
  if(params){ Object.keys(params).forEach(k=>{ str = str.replace(new RegExp("\\{"+k+"\\}","g"), params[k]); }); }
  return str;
}

const DataLayer = (function(){
  function read(){
    try{
      const raw = localStorage.getItem(APP_KEY);
      if(!raw) return null;
      const parsed = JSON.parse(raw);
      return migrate(parsed);
    }catch(e){ console.error("Coffer: failed to read saved data", e); return null; }
  }
  function migrate(data){
    if(!data.schemaVersion) data.schemaVersion = 1;
    // future migrations branch on data.schemaVersion here
    data.schemaVersion = SCHEMA_VERSION;
    return data;
  }
  const _writeRaw = (data)=>{
    try{
      localStorage.setItem(APP_KEY, JSON.stringify(data));
      return true;
    }catch(e){
      console.error("Coffer: failed to save", e);
      toast(t("common.error")+": "+(e && e.message ? e.message : "storage"), "error");
      return false;
    }
  };
  const writeDebounced = debounce((data)=>{ _writeRaw(data); onAfterSave(data); }, 400);
  let onAfterSave = ()=>{};
  function setAfterSaveHook(fn){ onAfterSave = fn; }
  function writeNow(data){ const ok=_writeRaw(data); onAfterSave(data); return ok; }
  function sizeEstimateBytes(data){ try{ return new Blob([JSON.stringify(data)]).size; }catch(e){ return JSON.stringify(data).length; } }
  return { read, write: writeDebounced, writeNow, sizeEstimateBytes, setAfterSaveHook };
})();

/* ===== SECTION: STORE (state + pub/sub) ===== */
const Store = (function(){
  let state = null;
  const listeners = new Set();
  function get(){ return state; }
  function set(nextState, opts){
    state = nextState;
    DataLayer.write(state);
    if(!opts || !opts.silent) emit();
  }
  function mutate(mutator, opts){
    mutator(state);
    DataLayer.write(state);
    if(!opts || !opts.silent) emit();
  }
  function emit(){ listeners.forEach(fn=>fn(state)); }
  function subscribe(fn){ listeners.add(fn); return ()=>listeners.delete(fn); }
  function init(){
    let loaded = DataLayer.read();
    if(!loaded){ loaded = defaultState(); seedDemoData(loaded); DataLayer.writeNow(loaded); }
    state = loaded;
  }
  return { get, set, mutate, subscribe, init };
})();

/* ===== SECTION: ROUTER ===== */
const Router = (function(){
  const routes = {};
  let current = null;
  function on(path, handler){ routes[path]=handler; }
  function resolve(){
    let hash = location.hash.replace(/^#\/?/, "");
    if(!hash) hash = "dashboard";
    const [path, queryStr] = hash.split("?");
    const parts = path.split("/").filter(Boolean);
    const routeName = parts[0] || "dashboard";
    const params = parts.slice(1);
    const query = {};
    if(queryStr) queryStr.split("&").forEach(kv=>{ const [k,v]=kv.split("="); if(k) query[decodeURIComponent(k)] = decodeURIComponent(v||""); });
    current = routeName;
    const handler = routes[routeName] || routes["dashboard"];
    handler(params, query);
    highlightNav(routeName);
  }
  function go(path){ location.hash = "#/"+path; }
  function start(){ window.addEventListener("hashchange", resolve); resolve(); }
  function currentRoute(){ return current; }
  function highlightNav(routeName){
    document.querySelectorAll(".navlink").forEach(a=>{
      a.classList.toggle("active", a.dataset.route===routeName);
    });
  }
  return { on, go, start, currentRoute };
})();

/* ===== SECTION: RENDER HELPERS ===== */
function h(tag, attrs, children){
  const el = document.createElement(tag.split(".")[0].split("#")[0] || "div");
  const idMatch = tag.match(/#([\w-]+)/); if(idMatch) el.id = idMatch[1];
  const classMatches = tag.match(/\.[\w-]+/g); if(classMatches) el.className = classMatches.map(c=>c.slice(1)).join(" ");
  attrs = attrs || {};
  Object.keys(attrs).forEach(k=>{
    const v = attrs[k];
    if(v==null || v===false) return;
    if(k==="class"){ el.className = (el.className? el.className+" ":"")+v; }
    else if(k.startsWith("on") && typeof v === "function"){ el.addEventListener(k.slice(2).toLowerCase(), v); }
    else if(k==="html"){ el.innerHTML = v; }
    else if(k==="checked" || k==="disabled" || k==="selected"){ el[k]=!!v; }
    else if(k==="value"){ el.value = v; }
    else { el.setAttribute(k, v); }
  });
  (children||[]).flat(Infinity).forEach(c=>{
    if(c==null || c===false) return;
    el.appendChild(typeof c === "string" || typeof c === "number" ? document.createTextNode(String(c)) : c);
  });
  return el;
}
function mountContent(node){
  const content = document.getElementById("contentRoot");
  content.innerHTML = "";
  content.appendChild(node);
}
function toast(msg, kind){
  const root = document.getElementById("toastRoot");
  const el = h("div.toast", {}, [msg]);
  if(kind==="error") el.style.background = "var(--bad)";
  root.appendChild(el);
  setTimeout(()=>{ el.style.transition="opacity .3s"; el.style.opacity="0"; setTimeout(()=>el.remove(),300); }, 3200);
}

let modalStack = [];
function openModal({ title, body, footer, onClose, wide }){
  const overlay = h("div.modal-overlay", { onclick:(e)=>{ if(e.target===overlay) closeModal(); } }, [
    h("div.modal", { style: wide?"max-width:760px":"" }, [
      h("div.modal-head", {}, [ h("h3",{},[title]), h("button.modal-close", { onclick:()=>closeModal(), "aria-label":t("common.close") }, ["×"]) ]),
      h("div.modal-body", { id:"modalBodyMount" }, [body]),
      footer ? h("div.modal-foot", {}, footer) : null
    ])
  ]);
  document.body.appendChild(overlay);
  modalStack.push({ overlay, onClose });
  document.body.style.overflow = "hidden";
  return overlay;
}
function closeModal(){
  const top = modalStack.pop();
  if(!top) return;
  top.overlay.remove();
  if(modalStack.length===0) document.body.style.overflow = "";
  if(top.onClose) top.onClose();
}
function confirmDialog(message, onYes){

}

/* ===== SECTION: TEST HARNESS =====
   Run window.__COFFER_TESTS__.run() from the browser console to execute
   in-file sanity checks against the data layer (no build tooling needed). */
const __COFFER_TESTS__ = (function(){
  const tests = [];
  function test(name, fn){ tests.push({name, fn}); }
  function run(){
    let pass=0, fail=0;
    tests.forEach(({name,fn})=>{
      try{ fn(assertEqual, assertTrue); console.log("%cPASS","color:green", name); pass++; }
      catch(e){ console.error("%cFAIL","color:red", name, e); fail++; }
    });
    console.log(`Coffer tests: ${pass} passed, ${fail} failed (of ${tests.length})`);
    return { pass, fail };
  }
  function assertEqual(a,b,msg){ if(JSON.stringify(a)!==JSON.stringify(b)) throw new Error((msg||"assertEqual failed")+" -- got "+JSON.stringify(a)+" expected "+JSON.stringify(b)); }
  function assertTrue(cond,msg){ if(!cond) throw new Error(msg||"assertTrue failed"); }
  return { test, run };
})();
window.__COFFER_TESTS__ = __COFFER_TESTS__;

/* ===== SECTION: SELECTORS (derived data) =====
   Placeholder balance/overdue math for the shell; the full transaction
   engine (recurrence expansion, series handling) lands in the next
   section and these selectors get used by it too. */
function computeAccountBalance(state, accountId){
  const acct = state.accounts.find(a=>a.id===accountId);
  if(!acct) return 0;
  let bal = acct.startingBalance||0;
  state.transactions.forEach(tx=>{
    if(tx.accountId!==accountId || tx.status!=="paid") return;
    bal += (tx.category==="income") ? tx.amount : -tx.amount;
  });
  return bal;
}
function computeCurrentBalance(state){
  return state.accounts.reduce((sum,a)=> sum + computeAccountBalance(state,a.id), 0);
}
function computeProjectedBalance(state, throughISO){
  const through = throughISO || todayISO();
  let bal = computeCurrentBalance(state);
  state.transactions.forEach(tx=>{
    if(tx.status==="paid") return;
    if(tx.dueDate<=through){ bal += (tx.category==="income") ? tx.amount : -tx.amount; }
  });
  return bal;
}
function deriveStatus(tx){
  if(tx.status==="paid") return "paid";
  if(tx.dueDate < todayISO()) return "overdue";
  return "planned";
}
function computeOverdueCount(state){
  return state.transactions.filter(tx=>deriveStatus(tx)==="overdue").length;
}

/* ===== SECTION: TRANSACTION ENGINE =====
   Recurring transactions are materialized as concrete occurrence records
   (not computed virtually at render time) so each occurrence can carry its
   own paid/planned status and be edited independently. All occurrences of
   one recurring transaction share a seriesId. */
const RECUR_HORIZON_YEARS = 2;
function recurrenceHorizonISO(){ return addYears(todayISO(), RECUR_HORIZON_YEARS); }

function stepDate(iso, frequency){
  switch(frequency){
    case "daily": return addDays(iso,1);
    case "weekly": return addDays(iso,7);
    case "biweekly": return addDays(iso,14);
    case "monthly": return addMonths(iso,1);
    case "every2months": return addMonths(iso,2);
    case "quarterly": return addMonths(iso,3);
    case "yearly": return addYears(iso,1);
    default: return null;
  }
}
/** Pure function: given a start date + frequency, returns the list of ISO
 *  occurrence dates from startISO through min(endISO, horizonISO) inclusive. */
function generateOccurrenceDates(startISO, frequency, endISO, horizonISO){
  if(!frequency || frequency==="oneTime") return [startISO];
  const stop = (endISO && endISO < horizonISO) ? endISO : horizonISO;
  const dates = [];
  let cur = startISO;
  let guard = 0;
  while(cur <= stop && guard < 2000){
    dates.push(cur);
    cur = stepDate(cur, frequency);
    if(!cur) break;
    guard++;
  }
  return dates;
}

function newTransactionBase(){
  return { id:null, category:"expenses", name:"", accountId:null, amount:0, dueDate:todayISO(),
    status:"planned", priority:2, type:"payment", paidWithCard:false, notes:"",
    recurrence:{ frequency:"oneTime", endDate:null }, seriesId:null, isVariable:true, personId:null };
}

/** Adds a transaction. If recurrence.frequency is not one-time, materializes
 *  the whole series up to the horizon (or its endDate). Returns the created
 *  record(s). markFirstPaid marks only the first occurrence as paid. */
function addTransactionToState(state, data, markFirstPaid){
  const seriesId = uid("series");
  const freq = (data.recurrence && data.recurrence.frequency) || "oneTime";
  const endDate = (data.recurrence && data.recurrence.endDate) || null;
  const dates = generateOccurrenceDates(data.dueDate, freq, endDate, recurrenceHorizonISO());
  const created = dates.map((d,i)=> Object.assign({}, newTransactionBase(), data, {
    id: uid("tx"), dueDate: d, seriesId,
    recurrence: { frequency:freq, endDate },
    status: (i===0 && markFirstPaid) ? "paid" : "planned",
    isVariable: freq==="oneTime" ? !!data.isVariable : false
  }));
  state.transactions.push(...created);
  return created;
}

function findTx(state, id){ return state.transactions.find(t=>t.id===id); }
function seriesOf(state, seriesId){ return state.transactions.filter(t=>t.seriesId===seriesId); }

function updateOccurrence(state, id, changes){
  const tx = findTx(state, id);
  if(!tx) return null;
  Object.assign(tx, changes);
  return tx;
}

/** Applies field changes to every not-yet-paid occurrence in the series.
 *  If the frequency or end date changed, future (unpaid) occurrences are
 *  regenerated from the edited occurrence's date forward. */
function updateSeries(state, seriesId, fromTxId, changes){
  const members = seriesOf(state, seriesId);
  const anchor = members.find(t=>t.id===fromTxId) || members[0];
  if(!anchor) return [];
  const freqChanged = changes.recurrence && (changes.recurrence.frequency !== anchor.recurrence.frequency || changes.recurrence.endDate !== anchor.recurrence.endDate);
  const staticFields = ["category","name","accountId","amount","priority","type","paidWithCard","notes","isVariable","personId"];
  members.forEach(m=>{
    if(m.status==="paid") return;
    staticFields.forEach(f=>{ if(changes[f]!==undefined) m[f]=changes[f]; });
  });
  if(freqChanged){
    const unpaidFuture = members.filter(m=> m.status!=="paid" && m.dueDate>=anchor.dueDate);
    unpaidFuture.forEach(m=>{ const idx=state.transactions.indexOf(m); if(idx>=0) state.transactions.splice(idx,1); });
    const freq = changes.recurrence.frequency;
    const endDate = changes.recurrence.endDate || null;
    const dates = generateOccurrenceDates(anchor.dueDate, freq, endDate, recurrenceHorizonISO());
    const template = Object.assign({}, anchor, changes, { recurrence:{frequency:freq,endDate} });
    dates.forEach(d=>{
      state.transactions.push(Object.assign({}, newTransactionBase(), template, { id: uid("tx"), dueDate:d, seriesId, status:"planned" }));
    });
  }
  return seriesOf(state, seriesId);
}

function deleteOccurrence(state, id){
  const idx = state.transactions.findIndex(t=>t.id===id);
  if(idx>=0) state.transactions.splice(idx,1);
}
function deleteSeries(state, seriesId){
  state.transactions = state.transactions.filter(t=>t.seriesId!==seriesId);
}

/** Extends any recurring series whose materialized occurrences don't yet
 *  reach the rolling horizon (called on boot so long-lived data files keep
 *  generating future occurrences without the user re-opening each series). */
function ensureRecurringHorizons(state){
  const bySeries = {};
  state.transactions.forEach(t=>{ if(t.recurrence.frequency!=="oneTime"){ (bySeries[t.seriesId]=bySeries[t.seriesId]||[]).push(t); } });
  const horizon = recurrenceHorizonISO();
  Object.keys(bySeries).forEach(sid=>{
    const members = bySeries[sid].sort((a,b)=>a.dueDate<b.dueDate?-1:1);
    const last = members[members.length-1];
    const endDate = last.recurrence.endDate;
    if(endDate && last.dueDate>=endDate) return;
    if(last.dueDate >= horizon) return;
    const nextStart = stepDate(last.dueDate, last.recurrence.frequency);
    if(!nextStart) return;
    const dates = generateOccurrenceDates(nextStart, last.recurrence.frequency, endDate, horizon);
    dates.forEach(d=>{
      state.transactions.push(Object.assign({}, newTransactionBase(), last, { id: uid("tx"), dueDate:d, status:"planned" }));
    });
  });
}

/** Likely-duplicate detection for variable (one-off) transactions: same
 *  category+name (case-insensitive) and amount, due within a few days of
 *  an existing entry. Excludes the transaction being edited (excludeId). */
const DUPLICATE_WINDOW_DAYS = 4;
function findLikelyDuplicates(state, candidate, excludeId){
  return state.transactions.filter(t=>{
    if(t.id===excludeId) return false;
    if(t.category!==candidate.category) return false;
    if((t.name||"").trim().toLowerCase() !== (candidate.name||"").trim().toLowerCase()) return false;
    if(Math.abs((t.amount||0)-(candidate.amount||0)) > 0.005) return false;
    return Math.abs(daysBetween(t.dueDate, candidate.dueDate)) <= DUPLICATE_WINDOW_DAYS;
  });
}

function openTransactionModal(existingTx, opts){
  opts = opts || {};
  const state = Store.get();
  const isEdit = !!existingTx;
  const isSeriesMember = isEdit && existingTx.recurrence && existingTx.recurrence.frequency !== "oneTime";
  const form = isEdit ? deepClone(existingTx) : Object.assign(newTransactionBase(), { dueDate: opts.presetDate || todayISO() });
  if(!isEdit) form.recurrence = { frequency:"oneTime", endDate:null };
  let editScope = "occurrence";
  let dupeConfirmed = false;
  let pendingDupes = [];

  function fieldsForCategory(){
    const extra = [];
    if(form.category==="expenses"){
      extra.push(field(t("common.type"), selectEl([{value:"payment",label:t("tx.payment")},{value:"refund",label:t("tx.refund")}], form.type, v=>{ form.type=v; }), null, null));
      extra.push(h("div.checkbox-field", {}, [
        h("input", { type:"checkbox", id:"pwc", checked:form.paidWithCard, onchange:(e)=>{ form.paidWithCard=e.target.checked; } }),
        h("label", { for:"pwc" }, [t("tx.paidWithCard")])
      ]));
    }
    return extra;
  }

  function bodyEl(){
    const nameListId = "namelist-"+form.category;
    const body = h("form.tx-form", { onsubmit:(e)=>e.preventDefault() }, [
      field(t("common.category"), selectEl(categoryOptions(), form.category, v=>{ form.category=v; rerender(); }), null, null),
      field(t("common.name"), h("div", {}, [
        h("input", { type:"text", list:nameListId, value:form.name, oninput:(e)=>{ form.name=e.target.value; } }),
        h("datalist", { id:nameListId }, nameOptionsFor(state, form.category).map(n=>h("option",{value:n})))
      ]), t("tx.nameHint")),
      h("div.field-row", {}, [
        field(t("common.amount"), h("input", { type:"number", step:"0.01", min:"0", value:form.amount, oninput:(e)=>{ form.amount=parseFloat(e.target.value)||0; } })),
        field(t("common.date"), h("input", { type:"date", value:form.dueDate, oninput:(e)=>{ form.dueDate=e.target.value; } }))
      ]),
      h("div.field-row", {}, [
        field(t("common.account"), selectEl([{value:"",label:t("tx.noAccount")}].concat(accountOptions(state)), form.accountId||"", v=>{ form.accountId=v||null; })),
        field(t("common.priority"), selectEl(priorityOptions(state), String(form.priority), v=>{ form.priority=Number(v); }))
      ]),
      h("div.field-row", {}, [
        field(t("common.frequency"), selectEl(RECUR_FREQS.map(f=>({value:f,label:t("common."+f)})), form.recurrence.frequency, v=>{ form.recurrence.frequency=v; rerender(); })),
        form.recurrence.frequency!=="oneTime" ? field(t("common.endDate"), h("input", { type:"date", value:form.recurrence.endDate||"", oninput:(e)=>{ form.recurrence.endDate=e.target.value||null; } })) : null
      ]),
      form.recurrence.frequency!=="oneTime" ? h("div.hint", { style:"margin:-6px 0 12px;" }, [t("tx.recurrenceHint")]) : null,
      ...fieldsForCategory(),
      field(t("common.notes"), h("textarea", { oninput:(e)=>{ form.notes=e.target.value; } }, [form.notes||""])),
      isSeriesMember ? field(t("tx.applyChangesTo"), selectEl([
        {value:"occurrence",label:t("tx.editThisOccurrence")}, {value:"series",label:t("tx.editEntireSeries")}
      ], editScope, v=>{ editScope=v; })) : null,
      h("div#dupeWarning", {})
    ]);
    return body;
  }

  let overlayRef;
  function rerender(){
    const mount = document.getElementById("modalBodyMount");
    mount.innerHTML = "";
    mount.appendChild(bodyEl());
  }

  function showDupeWarning(dupes){
    const holder = document.getElementById("dupeWarning");
    if(!holder) return;
    holder.innerHTML = "";
    if(!dupes.length) return;
    holder.appendChild(h("div.card", { style:"background:var(--gold-tint);border-color:var(--gold);margin:8px 0 0;" }, [
      h("strong", {}, ["⚠ "+t("tx.duplicateTitle")]),
      h("p", { style:"margin:6px 0;" }, [t("tx.duplicateBody")]),
      h("ul", { style:"margin:0 0 0 18px;padding:0;font-size:12.5px;" }, dupes.map(d=>h("li",{},[`${d.name} — ${fmtMoney(d.amount)} — ${fmtDate(d.dueDate)}`])))
    ]));
  }

  function doSave(markPaid, keepOpen){
    if(!form.name || !form.name.trim()){ toast(t("common.error")+": "+t("common.name"), "error"); return; }
    if(form.recurrence.frequency==="oneTime" && !dupeConfirmed){
      pendingDupes = findLikelyDuplicates(state, form, isEdit?existingTx.id:null);
      if(pendingDupes.length){ dupeConfirmed = true; showDupeWarning(pendingDupes); return; }
    }
    Store.mutate(s=>{
      const catList = s.settings.categoryNames[form.category] = s.settings.categoryNames[form.category] || [];
      if(form.name && !catList.some(n=>n.toLowerCase()===form.name.toLowerCase())) catList.push(form.name);
      if(isEdit){
        const changes = { category:form.category, name:form.name, accountId:form.accountId, amount:form.amount,
          priority:form.priority, type:form.type, paidWithCard:form.paidWithCard, notes:form.notes,
          isVariable: form.recurrence.frequency==="oneTime", recurrence: form.recurrence };
        if(isSeriesMember && editScope==="series"){
          updateOccurrence(s, existingTx.id, { dueDate: form.dueDate });
          updateSeries(s, existingTx.seriesId, existingTx.id, changes);
        } else {
          updateOccurrence(s, existingTx.id, Object.assign({ dueDate:form.dueDate }, changes));
        }
        if(markPaid) updateOccurrence(s, existingTx.id, { status:"paid" });
      } else {
        const created = addTransactionToState(s, form, markPaid);
        if(opts.onCreated) opts.onCreated(created);
      }
    });
    toast(t("tx.saved"));
    if(keepOpen){
      Object.assign(form, newTransactionBase(), { dueDate: form.dueDate, category:form.category, accountId:form.accountId });
      dupeConfirmed=false;
      rerender();
    } else {
      closeModal();
    }
    if(opts.onSaved) opts.onSaved();
  }

  function doDelete(){
    if(isSeriesMember){
      openModal({
        title: t("tx.deleteTransaction"),
        body: h("p", {}, [t("tx.deletePrompt")]),
        footer: [
          h("button.btn", { onclick:()=>closeModal() }, [t("common.cancel")]),
          h("button.btn.btn-danger", { onclick:()=>{ closeModal(); Store.mutate(s=>deleteOccurrence(s, existingTx.id)); toast(t("tx.deleted")); closeModal(); if(opts.onSaved) opts.onSaved(); } }, [t("tx.deleteThisOccurrence")]),
          h("button.btn.btn-danger", { onclick:()=>{ closeModal(); Store.mutate(s=>deleteSeries(s, existingTx.seriesId)); toast(t("tx.deleted")); closeModal(); if(opts.onSaved) opts.onSaved(); } }, [t("tx.deleteEntireSeries")])
        ]
      });
    } else {
      confirmDialog(t("tx.confirmDeleteOne"), ()=>{ Store.mutate(s=>deleteOccurrence(s, existingTx.id)); toast(t("tx.deleted")); closeModal(); if(opts.onSaved) opts.onSaved(); });
    }
  }

  const footer = [
    isEdit ? h("button.btn.btn-danger", { onclick:doDelete, style:"margin-right:auto;" }, [t("common.delete")]) : null,
    h("button.btn", { onclick:()=>closeModal() }, [t("common.cancel")]),
    h("button.btn", { onclick:()=>doSave(false, true) }, [t("common.saveAddAnother")]),
    h("button.btn.btn-primary", { onclick:()=>doSave(true,false) }, [t("common.saveMarkPaid")]),
    h("button.btn.btn-primary", { onclick:()=>doSave(false,false) }, [t("common.save")])
  ];
  overlayRef = openModal({ title: isEdit ? t("tx.editTransaction") : t("tx.addTransaction"), body: bodyEl(), footer });
}

let longPressTimer = null;

function txMatchesCalFilter(tx){
  const isRecurring = tx.recurrence.frequency !== "oneTime";
  return (isRecurring && calShowRecurring) || (!isRecurring && calShowVariable);
}

function renderCalendar(params){
  if(params && params[0] && /^\d{4}-\d{2}$/.test(params[0])) calMonth = params[0];
  window.__rerouteRefresh = renderCalendar;
  const state = Store.get();
  const [y,m] = calMonth.split("-").map(Number);
  const first = new Date(y, m-1, 1);
  const startOffset = (first.getDay() - state.settings.weekStart + 7) % 7;
  const daysInMonth = new Date(y, m, 0).getDate();
  const prevMonthDays = new Date(y, m-1, 0).getDate();

  const cells = []; // {iso, inMonth}
  for(let i=startOffset;i>0;i--) cells.push({ iso: addDays(calMonth+"-01", -i), inMonth:false });
  for(let d=1; d<=daysInMonth; d++) cells.push({ iso: calMonth+"-"+String(d).padStart(2,"0"), inMonth:true });
  while(cells.length % 7 !== 0) cells.push({ iso: addDays(cells[cells.length-1].iso,1), inMonth:false });

  const txByDay = {};
  state.transactions.filter(txMatchesCalFilter).forEach(tx=>{ (txByDay[tx.dueDate]=txByDay[tx.dueDate]||[]).push(tx); });

  const dowLabels = { en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], fr:["Dim","Lun","Mar","Mer","Jeu","Ven","Sam"],
    es:["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"], de:["So","Mo","Di","Mi","Do","Fr","Sa"] };
  const labelsRaw = dowLabels[state.settings.language] || dowLabels.en;
  const dowOrder = [0,1,2,3,4,5,6].map(i=>(i+state.settings.weekStart)%7);

  function dayChip(tx){
    const status = deriveStatus(tx);
    const chip = h("div.cal-chip.badge-"+tx.category+(status==="overdue"?".overdue":"")+(status==="paid"?".paid":""), {
      draggable:"true",
      title: tx.name+" — "+fmtMoney(tx.amount),
      onclick:(e)=>{ e.stopPropagation(); quickTransactionPopup(tx); },
      ondragstart:(e)=>{ e.dataTransfer.setData("text/plain", tx.id); }
    }, [tx.name]);
    return chip;
  }

  function dayCell(cellInfo){
    const dayTx = (txByDay[cellInfo.iso]||[]).sort((a,b)=>b.amount-a.amount);
    const shown = dayTx.slice(0,3);
    const extra = dayTx.length - shown.length;
    const isToday = cellInfo.iso===todayISO();
    const cell = h("div.cal-day"+(cellInfo.inMonth?"":".other-month")+(isToday?".today":""), {
      ondblclick:()=> openTransactionModal(null, { presetDate:cellInfo.iso, onSaved:refreshCurrentRoute }),
      ondragover:(e)=>{ e.preventDefault(); cell.classList.add("drag-over"); },
      ondragleave:()=>{ cell.classList.remove("drag-over"); },
      ondrop:(e)=>{ e.preventDefault(); cell.classList.remove("drag-over"); const id=e.dataTransfer.getData("text/plain");
        if(id){ Store.mutate(s=>updateOccurrence(s, id, { dueDate: cellInfo.iso })); refreshCurrentRoute(); } },
      onclick:()=>{ if(window.innerWidth<=860) openDaySlideIn(cellInfo.iso, dayTx); },
      ontouchstart:()=>{ longPressTimer = setTimeout(()=> openTransactionModal(null,{presetDate:cellInfo.iso,onSaved:refreshCurrentRoute}), 550); },
      ontouchend:()=>{ clearTimeout(longPressTimer); },
      ontouchmove:()=>{ clearTimeout(longPressTimer); }
    }, [
      h("div.cal-daynum", {}, [String(Number(cellInfo.iso.slice(8,10)))]),
      ...shown.map(dayChip),
      extra>0 ? h("div.cal-more", {}, [t("cal.moreCount",{n:extra})]) : null
    ]);
    return cell;
  }

  // weekly summary strip: one row per grid week
  const weekRows = [];
  let running = 0;
  for(let i=0;i<cells.length;i+=7){
    const weekCells = cells.slice(i,i+7);
    const weekTotal = weekCells.reduce((sum,c)=>{
      const items = txByDay[c.iso]||[];
      return sum + items.filter(tx=>tx.category!=="income").reduce((s2,tx)=>s2+tx.amount,0);
    },0);
    running += weekTotal;
    weekRows.push({ start:weekCells[0].iso, end:weekCells[6].iso, total:weekTotal, running });
  }

  // Weekly summary: one line per grid week with totals due + a running cumulative total
  const weekSummaryCard = h("div.card", {}, [
    h("h3",{},[t("cal.weekTotal")+" / "+t("cal.cumulative")]),
    h("table.data-table", {}, [
      h("thead",{},[h("tr",{},[t("common.from"),t("common.to"),t("cal.weekTotal"),t("cal.cumulative")].map(c=>h("th",{},[c])))]),
      h("tbody",{}, weekRows.map(w=> h("tr",{},[
        h("td",{},[fmtDate(w.start,{month:"short",day:"numeric"})]),
        h("td",{},[fmtDate(w.end,{month:"short",day:"numeric"})]),
        h("td.num",{},[fmtMoney(w.total)]),
        h("td.num",{},[fmtMoney(w.running)])
      ])))
    ])
  ]);

  const grid = h("div.cal-grid", {}, [
    ...dowOrder.map(i=>h("div.cal-dow", {}, [labelsRaw[i]])),
    ...cells.map(dayCell)
  ]);

  const toolbar = h("div.cal-toolbar", {}, [
    h("button.btn.btn-sm", { onclick:()=>Router.go("calendar/"+addMonths(calMonth+"-01",-1).slice(0,7)) }, ["‹"]),
    h("h2", {}, [fmtMonthYear(calMonth)]),
    h("button.btn.btn-sm", { onclick:()=>Router.go("calendar/"+addMonths(calMonth+"-01",1).slice(0,7)) }, ["›"]),
    h("button.btn.btn-sm", { onclick:()=>Router.go("calendar/"+todayISO().slice(0,7)) }, [t("common.today")]),
    h("div.cal-toggles", {}, [
      h("label",{},[h("input",{type:"checkbox",checked:calShowRecurring,onchange:(e)=>{ calShowRecurring=e.target.checked; renderCalendar(); }}), t("cal.showRecurring")]),
      h("label",{},[h("input",{type:"checkbox",checked:calShowVariable,onchange:(e)=>{ calShowVariable=e.target.checked; renderCalendar(); }}), t("cal.showVariable")])
    ]),
    h("button.btn.btn-primary.btn-sm", { onclick:()=>openTransactionModal(null,{onSaved:refreshCurrentRoute}) }, ["+ "+t("common.add")])
  ]);

  mountContent(h("div", {}, [ toolbar, grid, weekSummaryCard ]));
}
ROUTE_HANDLERS.calendar = renderCalendar;

function openDaySlideIn(iso, dayTx){
  const backdrop = h("div.cal-slidein-backdrop", { onclick:()=>{ backdrop.remove(); panel.remove(); } });
  const panel = h("div.cal-slidein", {}, [
    h("h3", {}, [fmtDate(iso, {weekday:"long",month:"long",day:"numeric"})]),
    dayTx.length ? h("div", {}, dayTx.map(tx=> h("div.card", { style:"padding:10px;margin-bottom:8px;cursor:pointer;", onclick:()=>{ quickTransactionPopup(tx); } }, [
      h("strong",{},[tx.name]), h("div.num",{},[fmtMoney(tx.amount)])
    ]))) : h("p", {}, [t("cal.noneToday")]),
    h("button.btn.btn-primary", { style:"width:100%;margin-top:10px;", onclick:()=>{ backdrop.remove(); panel.remove(); openTransactionModal(null,{presetDate:iso,onSaved:refreshCurrentRoute}); } }, ["+ "+t("cal.dayPanelAdd")])
  ]);
  document.body.appendChild(backdrop);
  document.body.appendChild(panel);
}

/* ===== SECTION: CHARTS (hand-rolled SVG; no chart library) =====
   Every chart here is meant to be paired with a data table by the caller —
   these functions only draw the picture. */
const CHART_PALETTE = ["#0F5257","#C1622D","#C98A2C","#4B7B4E","#6B5CA5","#B23A3A","#3B7A9E","#8A8377"];
function svgEl(tag, attrs){
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  Object.keys(attrs||{}).forEach(k=> el.setAttribute(k, attrs[k]));
  return el;
}
function donutChart(segments, opts){
  opts = opts||{};
  const size = opts.size||150, thickness = opts.thickness||20;
  const radius = (size-thickness)/2;
  const circumference = 2*Math.PI*radius;
  const total = segments.reduce((s,x)=>s+Math.max(0,x.value),0) || 1;
  const svg = svgEl("svg", { width:size, height:size, viewBox:`0 0 ${size} ${size}`, role:"img", "aria-label":opts.ariaLabel||"chart" });
  svg.appendChild(svgEl("circle", { cx:size/2, cy:size/2, r:radius, fill:"none", stroke:"var(--line)", "stroke-width":thickness }));
  let cumulative = 0;
  segments.forEach((seg,i)=>{
    if(seg.value<=0) return;
    const frac = seg.value/total;
    const dash = frac*circumference;
    const circle = svgEl("circle", {
      cx:size/2, cy:size/2, r:radius, fill:"none", stroke: seg.color||CHART_PALETTE[i%CHART_PALETTE.length],
      "stroke-width":thickness, "stroke-dasharray": `${dash} ${circumference-dash}`,
      "stroke-dashoffset": -(cumulative/total)*circumference, transform:`rotate(-90 ${size/2} ${size/2})`,
      "stroke-linecap":"butt"
    });
    svg.appendChild(circle);
    cumulative += seg.value;
  });
  if(opts.centerLabel){
    const text = svgEl("text", { x:size/2, y:size/2, "text-anchor":"middle", "dominant-baseline":"middle", "font-size":size*0.13, fill:"var(--ink)", "font-family":"var(--font-serif)", "font-weight":"700" });
    text.textContent = opts.centerLabel;
    svg.appendChild(text);
  }
  return svg;
}
function chartLegend(segments){
  return h("div.chart-legend", {}, segments.map((seg,i)=> h("div.li", {}, [
    h("span.swatch", { style:"background:"+(seg.color||CHART_PALETTE[i%CHART_PALETTE.length]) }),
    h("span", {}, [seg.label+" — "+fmtMoney(seg.value)])
  ])));
}
function barChart(bars, opts){
  opts = opts||{};
  const w = opts.width||480, h_ = opts.height||180, pad = 26;
  const max = Math.max(1, ...bars.map(b=>b.value));
  const bw = (w-pad*2)/bars.length;
  const svg = svgEl("svg", { width:"100%", height:h_, viewBox:`0 0 ${w} ${h_}`, preserveAspectRatio:"xMinYMid meet" });
  svg.appendChild(svgEl("line", { x1:pad, y1:h_-pad, x2:w-4, y2:h_-pad, stroke:"var(--line-strong)" }));
  bars.forEach((b,i)=>{
    const bh = ((h_-pad*2) * (b.value/max));
    const x = pad + i*bw + bw*0.15;
    const barW = bw*0.7;
    const y = h_-pad-bh;
    svg.appendChild(svgEl("rect", { x, y, width:Math.max(1,barW), height:Math.max(0,bh), fill: b.color||"var(--pine)", rx:2 }));
    const label = svgEl("text", { x:x+barW/2, y:h_-pad+13, "text-anchor":"middle", "font-size":9, fill:"var(--ink-faint)" });
    label.textContent = b.label;
    svg.appendChild(label);
  });
  return svg;
}
function lineChart(points, opts){
  opts = opts||{};
  const w = opts.width||480, h_ = opts.height||160, pad = 28;
  const vals = points.map(p=>p.y);
  const max = Math.max(...vals, 0), min = Math.min(...vals, 0);
  const range = (max-min)||1;
  const stepX = points.length>1 ? (w-pad*2)/(points.length-1) : 0;
  const svg = svgEl("svg", { width:"100%", height:h_, viewBox:`0 0 ${w} ${h_}`, preserveAspectRatio:"xMinYMid meet" });
  const zeroY = h_-pad-((0-min)/range)*(h_-pad*2);
  svg.appendChild(svgEl("line", { x1:pad, y1:zeroY, x2:w-4, y2:zeroY, stroke:"var(--line-strong)", "stroke-dasharray":"3 3" }));
  const coords = points.map((p,i)=>[pad+i*stepX, h_-pad-((p.y-min)/range)*(h_-pad*2)]);
  const path = coords.map((c,i)=> (i===0?"M":"L")+c[0].toFixed(1)+","+c[1].toFixed(1)).join(" ");
  svg.appendChild(svgEl("path", { d:path, fill:"none", stroke: opts.color||"var(--pine)", "stroke-width":2.5 }));
  coords.forEach(c=> svg.appendChild(svgEl("circle", { cx:c[0], cy:c[1], r:3, fill: opts.color||"var(--pine)" })));
  return svg;
}
function chartCard(title, chartNode, legendOrTableNode, help){
  return h("div.card.chart-card", {}, [
    h("h3", {}, [title, help?h("span.help-icon",{title:help},["?"]):null]),
    h("div.chart-wrap", {}, [ chartNode, legendOrTableNode ])
  ]);
}

/* ===== SECTION: MONTHLY INSIGHTS ===== */
function monthBudgetRecord(state, ym){
  const mb = state.settings.monthlyBudgets = state.settings.monthlyBudgets || {};
  return mb[ym] = mb[ym] || { rolloverIn:0, categoryGoals:{} };
}
let insightsMonth = todayISO().slice(0,7);
function renderMonthlyInsights(params){
  if(params && params[0] && /^\d{4}-\d{2}$/.test(params[0])) insightsMonth = params[0];
  window.__rerouteRefresh = renderMonthlyInsights;
  const state = Store.get();
  const rec = monthBudgetRecord(state, insightsMonth);
  const monthTx = state.transactions.filter(tx=>ymOf(tx.dueDate)===insightsMonth);

  const picker = h("div.toolbar", {}, [
    h("button.btn.btn-sm", { onclick:()=>Router.go("insights-monthly/"+addMonths(insightsMonth+"-01",-1).slice(0,7)) }, ["‹"]),
    h("h2",{},[fmtMonthYear(insightsMonth)]),
    h("button.btn.btn-sm", { onclick:()=>Router.go("insights-monthly/"+addMonths(insightsMonth+"-01",1).slice(0,7)) }, ["›"]),
    h("div.spacer"),
    h("div.field", { style:"margin:0;min-width:200px;" }, [
      h("label",{},[t("insights.rollover")]),
      h("input", { type:"number", step:"0.01", value:rec.rolloverIn, oninput:(e)=>{ rec.rolloverIn=parseFloat(e.target.value)||0; Store.mutate(s=>{}); renderStatusBarInline(); } })
    ])
  ]);

  const cards = CATEGORY_KEYS.map(cat=>{
    const items = monthTx.filter(tx=>tx.category===cat);
    const byName = {};
    items.forEach(tx=>{ byName[tx.name]=(byName[tx.name]||0)+tx.amount; });
    const segments = Object.keys(byName).map((name,i)=>({ label:name, value:byName[name], color:CHART_PALETTE[i%CHART_PALETTE.length] }));
    const totalExpected = items.reduce((s,tx)=>s+tx.amount,0);
    const totalPaid = items.filter(tx=>tx.status==="paid").reduce((s,tx)=>s+tx.amount,0);
    const goal = rec.categoryGoals[cat]||0;
    let goalNote = null;
    if(goal>0){
      const diff = totalPaid - goal;
      goalNote = h("p", { style:"font-size:12px;color:"+(diff>0?"var(--bad)":"var(--good)")+";" }, [
        diff>0 ? t("insights.overBudget") : (diff<0 ? t("insights.underBudget") : t("insights.onGoal")), " ("+fmtMoney(Math.abs(diff))+")"
      ]);
    }
    const table = items.length ? h("table.data-table", {}, [
      h("thead",{},[h("tr",{},[t("common.name"),t("insights.expected"),t("common.status")].map(c=>h("th",{},[c])))]),
      h("tbody",{}, items.map(tx=> h("tr",{},[ h("td",{},[tx.name]), h("td.num",{},[fmtMoney(tx.amount)]), h("td",{},[h("span.badge.badge-"+deriveStatus(tx),{},[t("common."+deriveStatus(tx))])]) ])))
    ]) : h("p", { class:"hint" }, [t("insights.noItems")]);
    return h("div.card.chart-card", {}, [
      h("h3",{},[t("cat."+cat)]),
      h("div.chart-wrap", {}, [
        items.length ? donutChart(segments, { centerLabel: fmtMoney(totalExpected).replace(/\.00$/,""), ariaLabel:t("cat."+cat) }) : h("div", { style:"width:150px;height:150px;display:flex;align-items:center;justify-content:center;color:var(--ink-faint);font-size:12px;" }, [t("insights.noItems")]),
        chartLegend(segments)
      ]),
      h("div.field", {}, [ h("label",{},[t("insights.goal")]), h("input", { type:"number", step:"0.01", value:goal, oninput:(e)=>{ rec.categoryGoals[cat]=parseFloat(e.target.value)||0; Store.mutate(s=>{}); renderMonthlyInsights(); } }) ]),
      goalNote,
      h("h4", { style:"font-size:12.5px;margin:10px 0 6px;color:var(--ink-soft);" }, [t("insights.expectedVsPaid")+" — "+fmtMoney(totalPaid)+" "+t("common.of")+" "+fmtMoney(totalExpected)]),
      table
    ]);
  });

  mountContent(h("div", {}, [ h("h2",{},[t("insights.monthlyTitle")]), picker, h("div.card-grid", {}, cards) ]));
}
ROUTE_HANDLERS["insights-monthly"] = renderMonthlyInsights;
function renderStatusBarInline(){ refreshShellChrome(); }

/* ===== SECTION: YEARLY OVERVIEW ===== */
let overviewYear = String(yearOf(todayISO()));
function renderYearlyOverview(params){
  if(params && params[0] && /^\d{4}$/.test(params[0])) overviewYear = params[0];
  window.__rerouteRefresh = renderYearlyOverview;
  const state = Store.get();
  const yearTx = state.transactions.filter(tx=>String(yearOf(tx.dueDate))===overviewYear);

  const picker = h("div.toolbar", {}, [
    h("button.btn.btn-sm", { onclick:()=>Router.go("insights-yearly/"+(Number(overviewYear)-1)) }, ["‹"]),
    h("h2",{},[overviewYear]),
    h("button.btn.btn-sm", { onclick:()=>Router.go("insights-yearly/"+(Number(overviewYear)+1)) }, ["›"])
  ]);

  const totalPlanned = yearTx.reduce((s,tx)=>s+tx.amount,0);
  const totalPaid = yearTx.filter(tx=>tx.status==="paid").reduce((s,tx)=>s+tx.amount,0);
  const summaryTable = h("table.data-table", {}, [
    h("thead",{},[h("tr",{},[t("common.category"),t("common.planned"),t("common.paid")].map(c=>h("th",{},[c])))]),
    h("tbody",{}, CATEGORY_KEYS.map(cat=>{
      const items = yearTx.filter(tx=>tx.category===cat);
      const planned = items.reduce((s,tx)=>s+tx.amount,0);
      const paid = items.filter(tx=>tx.status==="paid").reduce((s,tx)=>s+tx.amount,0);
      return h("tr",{},[ h("td",{},[t("cat."+cat)]), h("td.num",{},[fmtMoney(planned)]), h("td.num",{},[fmtMoney(paid)]) ]);
    }).concat([ h("tr", { style:"font-weight:700;" }, [ h("td",{},[t("common.total")]), h("td.num",{},[fmtMoney(totalPlanned)]), h("td.num",{},[fmtMoney(totalPaid)]) ]) ]))
  ]);

  const monthLabels = Array.from({length:12},(_,i)=> new Intl.DateTimeFormat(localeTag(),{month:"short"}).format(new Date(2000,i,1)));
  const trendCards = CATEGORY_KEYS.map(cat=>{
    const monthly = Array.from({length:12},(_,i)=>{
      const ym = overviewYear+"-"+String(i+1).padStart(2,"0");
      return yearTx.filter(tx=>tx.category===cat && ymOf(tx.dueDate)===ym).reduce((s,tx)=>s+tx.amount,0);
    });
    const bars = monthly.map((v,i)=>({ label:monthLabels[i], value:v, color:"var(--pine)" }));
    const table = h("table.data-table", { style:"font-size:11px;" }, [
      h("tbody",{},[ h("tr",{}, monthLabels.map(m=>h("th",{},[m]))), h("tr",{}, monthly.map(v=>h("td.num",{},[fmtMoney(v)]))) ])
    ]);
    return h("div.card.chart-card", {}, [ h("h3",{},[t("cat."+cat)]), barChart(bars), table ]);
  });

  mountContent(h("div", {}, [ h("h2",{},[t("insights.yearlyTitle")]), picker,
    h("div.card", {}, [ h("h3",{},[t("insights.yearPlannedVsPaid")]), summaryTable ]),
    h("h3", { style:"margin:18px 0 8px;" }, [t("insights.monthlyTrend")]),
    h("div.card-grid", {}, trendCards)
  ]));
}
ROUTE_HANDLERS["insights-yearly"] = renderYearlyOverview;
